name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly benchmark + e2e gate. 18:43 UTC (≈ 02:43 China). Staggered off
  # the top of the hour and off the meta's :23 cron. Re-enabled after the
  # `benchmark` job went green via manual workflow_dispatch:
  # the gate now runs the deterministic equivalence + pass-fired suite and
  # --label-excludes the wall-clock timing benches, so it is bounded (~11 min)
  # and not subject to the timing-suite hangs. Scheduled runs only ever use
  # the workflow file on the default branch.
  schedule:
    - cron: '43 18 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the upstream Topo refs this build is tested against.
  TOPO_CORE_REF: main
  TOPO_LANG_REF: main
  # topo-lang-java unpinned at promotion (2026-08-16): the L1 extractor
  # statement-shape fix is on main now.
  TOPO_LANG_JAVA_REF: main

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Provide BOTH pinned Gradle toolchains: 21 (transform) + 17 (decompile,
      # and the topo-build-jvm-java backend tool's run-time javac). setup-java
      # exports JAVA_HOME_21_<arch> + JAVA_HOME_17_<arch>, which the subprojects'
      # gradle.properties `fromEnv` points at (with auto-download=false). The
      # last version listed wins JAVA_HOME, so JAVA_HOME stays 17 for the
      # backend tool. This replaces the auto-download that stalled ~20 min on
      # the Windows runner.
      - name: Set up JDKs (21 transform + 17 decompile/backend)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17

      # Cache the Gradle artifacts (foojay-resolver plugin, ASM, gson, JUnit)
      # that the transform/ + decompile/ subprojects resolve from Maven Central
      # at build time. Without a warm cache every run re-fetches, so a transient
      # HTTP 429 (Maven Central rate-limiting the shared-runner egress IP) fails
      # the Build step. Restoring the cache means artifacts are fetched only on a
      # cold cache; restore-keys keeps a partial cache across dependency bumps.
      # Maven Central's operator (Sonatype) recommends caching over retrying for
      # 429 resilience. Cached on every OS now — Windows also builds the
      # transform/decompile JARs, so it resolves the same Gradle artifacts.
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.os }}-${{ hashFiles('transform/build.gradle.kts', 'transform/settings.gradle.kts', 'transform/gradle/wrapper/gradle-wrapper.properties', 'decompile/build.gradle.kts', 'decompile/settings.gradle.kts', 'decompile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.os }}-

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          # v6: the topo-lang-java dev branch TIP advanced (fix batch merged
          # to dev); the key interpolates the ref, not the ref's content, so
          # a cache saved against the pre-merge dev would keep serving the
          # stale extractor.
          key: topo-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-langjava-${{ env.TOPO_LANG_JAVA_REF }}-${{ matrix.os }}-v6

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang-java
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_JAVA_REF}" \
              https://github.com/topo-lang/topo-lang-java.git \
              "${RUNNER_TEMP}/topo-lang-java-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-java-src" \
                -B "${RUNNER_TEMP}/topo-lang-java-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_JAVA_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-java-build" --target install

      - name: Configure topo-jvm
        # The bundled Gradle wrappers (transform/gradlew + decompile/gradlew)
        # produce topo-transform.jar and topo-decompile-jvm-1.0.0.jar via CMake
        # custom commands. transform + decompile build on ALL platforms now,
        # Windows included: the former ~20 min Windows hang was Gradle
        # auto-downloading the pinned JDKs on Windows I/O. setup-java now
        # provides 21 + 17 and the subprojects' gradle.properties
        # (auto-download=false + fromEnv) point Gradle at them, so no download
        # happens. TOPO_JVM_GRADLE_ARGS adds --no-daemon --console=plain for
        # ephemeral-runner hygiene + clean logs.
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_JVM_BUILD_TESTS=ON \
              -DTOPO_JVM_GRADLE_ARGS="--no-daemon --console=plain"

      - name: Build
        # Backstop: if a Gradle toolchain ever fails to resolve and a fallback
        # tries to download/hang, fail in minutes instead of burning the 6h job
        # ceiling. A clean build (JARs + C++) finishes well under this.
        timeout-minutes: 30
        run: cmake --build build

      # The two Gradle subprojects' JUnit suites execute ONLY here — ctest
      # covers the C++ harness but has no gradle-test runner, so without this
      # step a pass regression only the JUnit layer would catch (incl. the
      # real-javac harness) ships green. Each suite runs under its pinned
      # toolchain (transform=21, decompile=17), resolved via the subprojects'
      # gradle.properties fromEnv exactly as in the jar build above.
      # --no-daemon --console=plain matches TOPO_JVM_GRADLE_ARGS from
      # Configure (ephemeral-runner hygiene + clean logs).
      - name: Test (Gradle JUnit — transform + decompile)
        # Same backstop as Build: a hung Gradle test run must fail in minutes,
        # not burn the 6-hour job ceiling.
        timeout-minutes: 30
        run: |
          cd transform
          ./gradlew test --no-daemon --console=plain
          cd ../decompile
          ./gradlew test --no-daemon --console=plain

      - name: Test
        run: |
          # Windows: the input-trust suite spawns the MinGW-linked
          # topo-build-jvm-java.exe; a stale libstdc++-6.dll earlier on PATH makes
          # it fail to load (0xC0000139). Put the build-time gcc bin dir FIRST so
          # the matching runtime resolves; the spawned child inherits this PATH.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cxx=$(grep -m1 '^CMAKE_CXX_COMPILER:' build/CMakeCache.txt | cut -d= -f2)
            if [ -n "$cxx" ]; then
              export PATH="$(cygpath -u "$(dirname "$cxx")"):${PATH}"
            fi
          fi
          ctest --test-dir build --output-on-failure --timeout 120

      - name: Install topo-jvm
        run: cmake --install build --prefix "${RUNNER_TEMP}/jvm-install"

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          cat > vcpkg.json <<'JSON'
          {
            "name": "topo-jvm-smoke",
            "version-string": "0.0.1",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(topo-jvm-find-package-smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(topo-jvm CONFIG REQUIRED)
          if(NOT TARGET topo::jvm::topo-build-jvm-java)
              message(FATAL_ERROR "topo::jvm::topo-build-jvm-java target was not imported")
          endif()
          add_executable(smoke smoke.cpp)
          target_compile_definitions(smoke PRIVATE
              TOPO_BUILD_JVM_JAVA_EXE="$<TARGET_FILE:topo::jvm::topo-build-jvm-java>"
              TOPO_TRANSFORM_JAR="${TOPO_JVM_LIBDIR}/topo-transform.jar"
              TOPO_DECOMPILE_JAR="${TOPO_JVM_LIBDIR}/topo-decompile-jvm-1.0.0.jar")
          if(MINGW)
              target_link_options(smoke PRIVATE -static -static-libgcc -static-libstdc++)
          endif()
          CMAKE
          cat > smoke.cpp <<'CPP'
          #include <cstdio>
          #include <filesystem>
          int main() {
              namespace fs = std::filesystem;
              if (!fs::exists(TOPO_BUILD_JVM_JAVA_EXE)) return 1;
              // transform + decompile JARs are built on every platform now
              // (Windows included), so require them everywhere.
              if (!fs::exists(TOPO_TRANSFORM_JAR)) return 1;
              if (!fs::exists(TOPO_DECOMPILE_JAR)) return 1;
              std::printf("topo-jvm find_package OK\n");
              return 0;
          }
          CPP
          cmake -S . -B build -G Ninja \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/jvm-install;${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          # bash on Windows + MinGW doesn't always resolve ./build/smoke
          # to .exe; pick the right name explicitly.
          if [ "${{ runner.os }}" = "Windows" ]; then
              ./build/smoke.exe
          else
              ./build/smoke
          fi

  # ── Benchmark + e2e gate (schedule + manual only) ──────
  # The 14 JVM benchmarks + the bytecode-equivalence suite. Gated to
  # schedule / workflow_dispatch so it never adds its tens of minutes to a
  # PR. Extends the build-and-test bootstrap with a topo-cli install — that
  # provides the `topo-build` executable the benchmark artifact pre-build
  # invokes — and configures TOPO_JVM_BUILD_E2E=ON. Linux only: perf
  # measurement wants one stable platform. perf is NOT excluded — pass-fired
  # + bytecode-diff equivalence prove each ASM pass took effect, and the
  # four-way (vanilla/base/auto/forced) category contracts gate timing
  # regressions. The e2e harness self-demotes a timing ERROR to WARN when
  # run-to-run variance is high (CV > 0.05 after 10 interleaved rounds) and
  # skips ratio checks below a 10 ms noise floor, so a real regression fails
  # while runner noise does not.
  benchmark:
    # The deterministic e2e (functional + equivalence + pass-fired) now gates
    # push + PR too — not just schedule/dispatch. On push/PR/schedule BENCH_FLAG
    # is empty (no timing build) and the obfuscation timing-guard step stays
    # workflow_dispatch-only, so the Test step runs ONLY the deterministic
    # labels (ctest -L e2e --label-exclude "perf|benchmark"); the 40-90 min
    # timing suite never lands on the PR gate.
    # No `if:` → runs on every workflow trigger (push to main, PR, dispatch,
    # nightly schedule).
    name: benchmark + e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bounds a runaway instead of burning the 6-hour default. 60 (was 45) gives
    # the cold windows-2022 full-stack bootstrap headroom to build + populate its
    # caches on the first run; ubuntu/macos finish well under it.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 re-added: the cold-bootstrap Gradle DAEMON hang is fixed
        # (--no-daemon on both topo-jvm and the lang-java JVM-backend runtime-jar
        # build below), and the e2e .sh TEST_LAUNCHER that broke gtest discovery
        # on Windows is replaced by in-harness setenv/_putenv_s env injection
        # (E2eHarness.cpp). First Windows iterations are blind (no local Windows).
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      # 25 is listed LAST so JAVA_HOME=25 — required because the topo runtime
      # jar (topo-lang-java runtime/build.gradle.kts) pins its Gradle toolchain
      # to Java 25 → class v69, so the e2e program that links it must RUN on
      # Java 25 (a Java-21 runtime aborts with UnsupportedClassVersionError).
      # The backend javac=25 still honours `--release 21` for user classes
      # (v65). On Linux the e2e harness runs with JAVA_HOME; on macOS it probes
      # the newest installed JDK (CMakeLists.txt, highest-first) — both resolve
      # to 25. 21 (transform) + 17 (decompile) stay installed for the
      # subprojects' fromEnv toolchains.
      - name: Set up JDKs (25 runtime/execution + 21 transform + 17 decompile)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      # Cache the Gradle artifacts the transform/ + decompile/ subprojects
      # resolve from Maven Central (see the build-and-test job for the rationale)
      # so a transient 429 only bites a cold cache. Shares the gradle-ubuntu-24.04
      # namespace with that job — same subprojects, so either run seeds the other.
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.os }}-${{ hashFiles('transform/build.gradle.kts', 'transform/settings.gradle.kts', 'transform/gradle/wrapper/gradle-wrapper.properties', 'decompile/build.gradle.kts', 'decompile/settings.gradle.kts', 'decompile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.os }}-

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      # Upstream install prefix — the same chain as build-and-test PLUS
      # topo-cli. Separate cache key (…-cli-…) so it never collides with the
      # build-and-test job's prefix. Keyed on the pinned refs like that job
      # (branch-name, not SHA — same freshness tradeoff the repo already uses).
      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          # v5: re-clone+rebuild topo-cli@main to pick up the Windows
          # .jar.exe output-suffix fix (Topo-lang/topo-cli#3). The cache is
          # keyed on REF=main, so without a bump a hit would serve the stale
          # buggy topo-cli install the prior windows run saved.
          # v7: same dev-tip-advanced rotation as the build-and-test cache
          # (lang-java dev moved under the interpolated ref).
          # v8: topo-cli MAIN advanced at promotion (2026-08-16); the
          # cli-main segment is a literal and cannot interpolate the ref's
          # content — without a bump a hit would serve the pre-promotion
          # topo-cli install.
          key: topo-bench-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-langjava-${{ env.TOPO_LANG_JAVA_REF }}-cli-main-${{ matrix.os }}-v8-jvmbackend

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang-java
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_JAVA_REF}" \
              https://github.com/topo-lang/topo-lang-java.git \
              "${RUNNER_TEMP}/topo-lang-java-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-java-src" \
                -B "${RUNNER_TEMP}/topo-lang-java-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_JAVA_BUILD_TESTS=OFF \
                -DTOPO_LANG_JAVA_ENABLE_JVM_BACKEND=ON \
                -DTOPO_GRADLE_JAVA_HOME="${JAVA_HOME}" \
                -DTOPO_LANG_JAVA_GRADLE_ARGS="--no-daemon --console=plain"
          cmake --build "${RUNNER_TEMP}/topo-lang-java-build" --target install

      # topo-cli provides the `topo-build` executable the benchmark artifact
      # pre-build invokes. Installed last so its find_package(topo-lang-java)
      # picks up the Java plugin already in the prefix.
      - name: Build & install topo-cli
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch main \
              https://github.com/topo-lang/topo-cli.git \
              "${RUNNER_TEMP}/topo-cli-src"
          cmake -S "${RUNNER_TEMP}/topo-cli-src" \
                -B "${RUNNER_TEMP}/topo-cli-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-cli-build" --target install

      - name: Configure topo-jvm (e2e + benchmarks)
        run: |
          # On manual dispatch, also build the timing benchmarks so the
          # obfuscation-timeout regression guard below can run them. The
          # nightly schedule skips them: the full timing suite serializes via
          # the topo_bench_measure resource lock and takes 40-90 min, which is
          # not a useful PR/nightly gate (see issue
          # bench-timing-ci-duration-and-obfuscation-hang).
          BENCH_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BENCH_FLAG="-DTOPO_JVM_BUILD_BENCHMARKS=ON"
          fi
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_JVM_BUILD_TESTS=ON \
              -DTOPO_JVM_BUILD_E2E=ON \
              -DTOPO_JVM_GRADLE_ARGS="--no-daemon --console=plain" \
              ${BENCH_FLAG}

      - name: Build
        run: cmake --build build

      # Deterministic gate: e2e functional + equivalence + pass-fired, with the
      # wall-clock TIMING benches EXCLUDED (--label-exclude "perf|benchmark").
      # The timing suite serializes via the topo_bench_measure resource lock and
      # runs 10 interleaved rounds per case → 40-90 min and prone to hangs on a
      # shared runner (it is not a reliable regression signal there), so it is
      # NOT a CI gate. Run it manually instead:
      #   cmake --build build --target topo-bench-artifacts   # pre-build variants
      #   ctest --test-dir build -L benchmark                 # measure
      # Equivalence builds its variants on-demand (no pre-build needed here) and
      # proves each pass fires AND preserves behavior (timing stripped).
      - name: Test (e2e equivalence + pass-fired; timing excluded)
        run: |
          # Windows: MinGW-built test exes launched at ctest time need the
          # build compiler's libstdc++-6.dll ahead of any stale copy earlier on
          # PATH, else they abort with 0xC0000139 (see topo-core 44d3155).
          if [ "$RUNNER_OS" = "Windows" ]; then
            cxx=$(grep -m1 '^CMAKE_CXX_COMPILER:' build/CMakeCache.txt | cut -d= -f2)
            if [ -n "$cxx" ]; then
              export PATH="$(cygpath -u "$(dirname "$cxx")"):${PATH}"
            fi
          fi
          ctest --test-dir build -L e2e --label-exclude "perf|benchmark" --output-on-failure --timeout 300

      # Manual-only timing lane. Two jobs:
      #  1. Obfuscation 300s-timeout regression guard: the obfuscation cases
      #     used to exceed the 300s per-test ctest TIMEOUT on shared ubuntu
      #     runners (500_000-iteration inner loops); benchmarks/obfuscation/.../
      #     Main.java cut WORK to 20_000. Run them under the same 300s TIMEOUT
      #     to prove they still finish comfortably.
      #  2. Standing perf triage surface: JvmPassBench_ENHANCE_Lifetime_Unfriendly
      #     is the one JvmPassBench timing case with an unresolved absolute-ratio
      #     failure (stable ~1.22x on a dev macOS machine) — keep it in the
      #     manual lane so a public runner can reproduce or clear it.
      # The -R regex must match the DISCOVERED test names
      # JvmPassBench_<CATEGORY>_<Name>.Run (the category token sits between
      # suite and case name — see CATEGORY_BENCH_TEST_F in
      # test/e2e/E2eHarness.h). Requires BENCH_FLAG above, so it is
      # workflow_dispatch only.
      - name: Timing bench — obfuscation timeout guard + lifetime-unfriendly triage (manual)
        if: github.event_name == 'workflow_dispatch'
        # Backstop: three timing cases (each up to 10 interleaved rounds) must
        # not approach the 60-min job ceiling; per-test TIMEOUT stays 300s.
        timeout-minutes: 30
        # Fail loudly on an empty selection: ctest exits 0 when -R matches
        # nothing, which is how the previous regex spent months selecting
        # zero tests while the step stayed green (issue
        # jvm-timing-guard-regex-zero-tests).
        run: |
          _out="$(ctest --test-dir build -L benchmark -R "JvmPassBench_INSTRUMENT_Obfuscation_(Friendly|Unfriendly)|JvmPassBench_ENHANCE_Lifetime_Unfriendly" --output-on-failure --timeout 300 2>&1)"
          _rc=$?
          printf '%s\n' "${_out}"
          if printf '%s\n' "${_out}" | grep -q "No tests were found"; then
            echo "::error::timing step selected zero tests — the -R regex matched no discovered name (check CATEGORY_BENCH_TEST_F name synthesis)"
            exit 1
          fi
          exit ${_rc}
