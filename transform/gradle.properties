# Gradle build performance — applies to every invocation of this subproject's
# `./gradlew`, whether driven by CMake (topo-jvm/CMakeLists.txt) or by hand.
#
# These six Topo Gradle roots historically dropped `--no-daemon` on the CMake
# side after a long-fixed Topo core memory-leak made the persistent daemon
# unsafe. With that gone, the daemon is the single biggest speed-up: 5 of the
# 6 invocations during a clean build reuse a warm JVM instead of paying ~1 s
# of cold-start per JAR.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx2g

# Disable Gradle's virtual file system file-watching. On the windows-2022 CI
# runner the file-watch handler intermittently throws
# `java.lang.IllegalStateException: Cannot start managing file contention
# because this handler has been closed`, failing the JAR build (topo-transform.jar)
# non-deterministically — the same commit passes on a push run and fails on a
# scheduled run. File-watching only pays off for a persistent daemon doing
# incremental rebuilds; the CMake-driven JAR build is effectively one-shot, so
# turning it off removes the flake source with no real speed cost.
org.gradle.vfs.watch=false

# Toolchain provisioning (Windows JAR-build fix). auto-download=false stops
# Gradle from fetching a JDK on a toolchain cache miss — on the Windows runner
# that download stalls ~20 min on I/O (the original "Gradle hangs" symptom);
# false converts any missing-toolchain case into a fast, clear failure instead.
# CI provides the pinned JDKs (17 decompile, 21 transform, 25 benchmark) via
# setup-java and points Gradle at them through fromEnv; the X64 + ARM64 suffixes
# cover the ubuntu/windows + macos-14 (Apple Silicon) runners, and Gradle
# ignores the env vars that are absent on a given runner. A local build resolves
# toolchains from Gradle's auto-detected installations — install the pinned JDK
# if a build reports "No matching toolchains".
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_17_ARM64,JAVA_HOME_21_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_X64,JAVA_HOME_25_ARM64
