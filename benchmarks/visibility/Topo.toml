[project]
name = "java_visibility"

[topo]
root = "topo/main.topo"

[build]
language = "java"
sources = ["src/main/java"]
output = "java_visibility.jar"
output_type = "exe"

[build.java]
target_version = "21"

[builder]
mode = "dev"

# Benchmark scaffolding symbols are outside the .topo contract (check-only; no optimization effect).
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = [
    "app::Main::benchmarkMedianUs",
    "app::Main::friendlyWork",
    "app::Main::unfriendlyWork",
]
