[project]
name = "java_observability"

[topo]
root = "topo/main.topo"

[build]
language = "java"
sources = ["src/main/java"]
output = "java_observability.jar"
output_type = "exe"

[build.java]
target_version = "21"

[observability]
mode = "force"
exporter = "stdout"

[builder]
mode = "dev"

# Benchmark scaffolding symbols are outside the .topo contract (check-only; no optimization effect).
[completeness]
ignore_constructors = true
ignore_destructors = true
ignore_patterns = [
    "app::Main",
    "app::Main::benchmarkMedianUs",
    "app::Main::run",
    "app::Main::runUnfriendly",
]
